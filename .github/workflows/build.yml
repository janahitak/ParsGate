name: Build ParsGate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify Vazirmatn Font
        run: |
          $fontPath = "src\ParsGate\Assets\Fonts\Vazirmatn-Bold.ttf"
          if (-not (Test-Path $fontPath)) {
            Write-Host "Font not found, downloading from official release..."
            $url = "https://github.com/rastikerdar/vazirmatn/releases/download/v33.003/Vazirmatn-Font-v33.003.zip"
            Invoke-WebRequest -Uri $url -OutFile "Vazirmatn.zip"
            Expand-Archive -Path "Vazirmatn.zip" -DestinationPath "VazirmatnExtracted" -Force
            $fontFile = Get-ChildItem "VazirmatnExtracted" -Recurse -Filter "Vazirmatn-Bold.ttf" | Select-Object -First 1
            if ($fontFile) {
              Copy-Item $fontFile.FullName -Destination $fontPath -Force
              Write-Host "Downloaded and installed Vazirmatn-Bold.ttf"
            } else {
              Write-Error "Vazirmatn-Bold.ttf not found in release archive"
              exit 1
            }
            Remove-Item "Vazirmatn.zip", "VazirmatnExtracted" -Recurse -Force -ErrorAction SilentlyContinue
          } else {
            Write-Host "Font already exists at $fontPath"
          }

      - name: Restore dependencies
        run: dotnet restore src/ParsGate/ParsGate.csproj

      - name: Build
        id: build
        run: |
          echo "=== Checking project structure ==="
          ls -la src/ParsGate/
          ls -la src/ParsGate/Assets/
          echo "=== .NET Info ==="
          dotnet --info
          echo "=== Building ==="
          dotnet build src/ParsGate/ParsGate.csproj --configuration Release --no-restore --verbosity detailed 2>&1 | tee build.log
        continue-on-error: true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 30

      - name: Check build result
        if: failure()
        run: |
          echo "Build failed, see build-log artifact for details"
          exit 1

      - name: Download Xray-core
        run: |
          $url = "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip"
          Invoke-WebRequest -Uri $url -OutFile "Xray-windows-64.zip"
          Expand-Archive -Path "Xray-windows-64.zip" -DestinationPath "src\ParsGate\publish\cores" -Force
          Remove-Item "Xray-windows-64.zip"

      - name: Download sing-box
        run: |
          # Get latest sing-box release asset for windows-amd64
          $api = "https://api.github.com/repos/SagerNet/sing-box/releases/latest"
          $release = Invoke-RestMethod -Uri $api -Headers @{Accept="application/vnd.github.v3+json"}
          $asset = $release.assets | Where-Object { $_.name -like "sing-box-*-windows-amd64.zip" -and $_.name -notlike "*legacy*" } | Select-Object -First 1
          if (-not $asset) {
            Write-Error "Could not find sing-box windows-amd64 asset"
            exit 1
          }
          Write-Host "Downloading $($asset.name)..."
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "sing-box.zip"
          Expand-Archive -Path "sing-box.zip" -DestinationPath "sing-box-extracted" -Force
          $exe = Get-ChildItem "sing-box-extracted" -Recurse -Filter "sing-box.exe" | Select-Object -First 1
          if ($exe) {
            Copy-Item $exe.FullName -Destination "src\ParsGate\publish\cores\sing-box.exe" -Force
            Write-Host "Copied sing-box.exe"
          } else {
            Write-Error "sing-box.exe not found in archive"
            exit 1
          }
          Remove-Item "sing-box.zip", "sing-box-extracted" -Recurse -Force

      - name: Download Iran rules (geoip-ir.srs, geosite-ir.srs, geoip.dat, geosite.dat)
        run: |
          mkdir src\ParsGate\publish\rules -Force
          $baseUrl = "https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download"
          # Download v2ray format .dat files (contain Iran categories)
          $files = @("geoip.dat", "geosite.dat")
          foreach ($file in $files) {
            $url = "$baseUrl/$file"
            $out = "src\ParsGate\publish\rules\$file"
            Write-Host "Downloading $file..."
            Invoke-WebRequest -Uri $url -OutFile $out
          }
          # Also copy as .srs names for compatibility (sing-box can use v2ray .dat format)
          Copy-Item "src\ParsGate\publish\rules\geoip.dat" "src\ParsGate\publish\rules\geoip-ir.srs" -Force
          Copy-Item "src\ParsGate\publish\rules\geosite.dat" "src\ParsGate\publish\rules\geosite-ir.srs" -Force

      - name: Verify publish output
        run: |
          Write-Host "=== Publish Directory ==="
          Get-ChildItem "src\ParsGate\publish" -Recurse | Select-Object FullName, Length
          Write-Host "=== Cores ==="
          Get-ChildItem "src\ParsGate\publish\cores" -ErrorAction SilentlyContinue | Select-Object FullName, Length
          Write-Host "=== Rules ==="
          Get-ChildItem "src\ParsGate\publish\rules" -ErrorAction SilentlyContinue | Select-Object FullName, Length

      - name: Compile Inno Setup Installer and verify
        run: |
          echo "=== Checking setup.iss and icon ==="
          ls -la installer/
          ls -la ../src/ParsGate/Assets/
          echo "=== GITHUB_WORKSPACE: $env:GITHUB_WORKSPACE ==="
          echo "=== PWD: $(Get-Location) ==="
          echo "=== Running ISCC from installer directory ==="
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Error "ISCC.exe not found at $iscc"
            exit 1
          }
          Push-Location installer
          & $iscc setup.iss 2>&1 | Tee-Object -Variable isccOutput
          $isccOutput
          $isccExitCode = $LASTEXITCODE
          Pop-Location
          echo "=== After Pop-Location PWD: $(Get-Location) ==="
          # Write log to workspace root
          $isccOutput | Out-File -FilePath "iscc.log" -Encoding utf8
          echo "=== Wrote iscc.log to workspace root ==="
          ls -la iscc.log
          echo "=== ISCC Exit Code: $isccExitCode ==="
          Get-Content iscc.log
          echo "=== Checking for installer output ==="
          ls -la installer/
          ls -la installer/ParsGate-Setup-v0.1.exe 2>$null || echo "Installer not found in installer dir"
          Get-ChildItem -Recurse "$env:GITHUB_WORKSPACE" -Filter "ParsGate-Setup*.exe" | Select-Object FullName, Length
          if (-not (Test-Path "installer/ParsGate-Setup-v0.1.exe")) {
            Write-Error "Installer not found!"
            exit 1
          }
          echo "=== Installer found! ==="
          ls -la installer/ParsGate-Setup-v0.1.exe
        continue-on-error: true

      - name: Upload ISCC log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iscc-log
          path: iscc.log
          retention-days: 30

      - name: Upload installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ParsGate-Setup-v0.1
          path: installer/ParsGate-Setup-v0.1.exe
          retention-days: 30

      - name: Check ISCC result
        if: failure()
        run: |
          echo "ISCC failed, see iscc-log artifact for details"
          exit 1

      - name: Create Release v0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1
          name: ParsGate v0.1
          body: |
            ## ParsGate v0.1 - Initial Release
            
            Windows VPN/circumvention tool with:
            - Xray-core (SOCKS5) + sing-box (TUN) core engines
            - Iran Direct routing (geoip-ir, geosite-ir)
            - Split Tunneling (process/domain/IP based)
            - Kill Switch with anti-lockout
            - NVDA-accessible high-contrast UI (RTL, Persian)
            - Silent elevated execution via Task Scheduler
          files: installer/ParsGate-Setup-v0.1.exe
          generate_release_notes: false
          make_latest: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}