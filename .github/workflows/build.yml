name: Build ParsGate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "0.6"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify Vazirmatn Font
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fontPath = "src\ParsGate\Assets\Fonts\Vazirmatn-Bold.ttf"
          if (-not (Test-Path $fontPath)) {
            Write-Host "Font not found, downloading from official release..."
            $url = "https://github.com/rastikerdar/vazirmatn/releases/download/v33.003/Vazirmatn-Font-v33.003.zip"
            Invoke-WebRequest -Uri $url -OutFile "Vazirmatn.zip"
            Expand-Archive -Path "Vazirmatn.zip" -DestinationPath "VazirmatnExtracted" -Force
            $fontFile = Get-ChildItem "VazirmatnExtracted" -Recurse -Filter "Vazirmatn-Bold.ttf" | Select-Object -First 1
            if (-not $fontFile) { throw "Vazirmatn-Bold.ttf not found in release archive" }
            New-Item -ItemType Directory -Force -Path (Split-Path $fontPath) | Out-Null
            Copy-Item $fontFile.FullName -Destination $fontPath -Force
            Remove-Item "Vazirmatn.zip", "VazirmatnExtracted" -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "Downloaded and installed Vazirmatn-Bold.ttf"
          } else {
            Write-Host "Font already exists at $fontPath"
          }

      - name: Restore dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore src/ParsGate/ParsGate.csproj
          if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed with exit code $LASTEXITCODE" }

      - name: Publish application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publishDir = "src\ParsGate\publish"
          if (Test-Path $publishDir) { Remove-Item $publishDir -Recurse -Force }
          dotnet publish src/ParsGate/ParsGate.csproj -c Release -r win-x64 --self-contained false -o $publishDir 2>&1 | Tee-Object -FilePath publish.log
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "$publishDir\ParsGate.exe")) { throw "ParsGate.exe missing from publish output" }
          Write-Host "Publish OK"

      - name: Upload publish log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-log
          path: publish.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Download Xray-core
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path "src\ParsGate\publish\cores" | Out-Null
          Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip" -OutFile "Xray-windows-64.zip"
          Expand-Archive -Path "Xray-windows-64.zip" -DestinationPath "src\ParsGate\publish\cores" -Force
          Remove-Item "Xray-windows-64.zip"
          if (-not (Test-Path "src\ParsGate\publish\cores\xray.exe")) { throw "xray.exe missing after extraction" }

      - name: Download sing-box
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/SagerNet/sing-box/releases/latest" -Headers @{ Accept = "application/vnd.github.v3+json" }
          $asset = $release.assets | Where-Object { $_.name -like "sing-box-*-windows-amd64.zip" -and $_.name -notlike "*legacy*" } | Select-Object -First 1
          if (-not $asset) { throw "Could not find sing-box windows-amd64 asset" }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "sing-box.zip"
          Expand-Archive -Path "sing-box.zip" -DestinationPath "sing-box-extracted" -Force
          $exe = Get-ChildItem "sing-box-extracted" -Recurse -Filter "sing-box.exe" | Select-Object -First 1
          if (-not $exe) { throw "sing-box.exe not found in archive" }
          Copy-Item $exe.FullName -Destination "src\ParsGate\publish\cores\sing-box.exe" -Force
          Remove-Item "sing-box.zip", "sing-box-extracted" -Recurse -Force

      - name: Download Iran rules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path "src\ParsGate\publish\rules" | Out-Null
          $baseUrl = "https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download"
          foreach ($file in @("geoip.dat", "geosite.dat")) {
            Invoke-WebRequest -Uri "$baseUrl/$file" -OutFile "src\ParsGate\publish\rules\$file"
          }
          Copy-Item "src\ParsGate\publish\rules\geoip.dat" "src\ParsGate\publish\rules\geoip-ir.srs" -Force
          Copy-Item "src\ParsGate\publish\rules\geosite.dat" "src\ParsGate\publish\rules\geosite-ir.srs" -Force

      - name: Verify publish output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem "src\ParsGate\publish" -Recurse -File | Select-Object FullName, Length
          if (-not (Test-Path "src\ParsGate\publish\ParsGate.exe")) { throw "ParsGate.exe missing" }
          if (-not (Test-Path "src\ParsGate\publish\cores\xray.exe")) { throw "xray.exe missing" }
          if (-not (Test-Path "src\ParsGate\publish\cores\sing-box.exe")) { throw "sing-box.exe missing" }

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          if (-not (Test-Path "src\ParsGate\Assets\app.ico")) { throw "app.ico missing" }

          $workspace = $env:GITHUB_WORKSPACE
          $outDir = Join-Path $workspace "installer"
          $expected = Join-Path $outDir "ParsGate-Setup-v$env:APP_VERSION.exe"

          # setup.iss is relative to installer/, so run ISCC from there.
          # Output name is pinned by OutputBaseFilename in setup.iss; OutputDir=. resolves to installer/.
          Push-Location $outDir
          try {
            & $iscc "setup.iss" 2>&1 | Tee-Object -FilePath (Join-Path $workspace "iscc.log")
            $code = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          if ($code -ne 0) { throw "ISCC failed with exit code $code" }
          if (-not (Test-Path $expected)) {
            Get-ChildItem -Recurse $workspace -Filter "ParsGate-Setup*.exe" | Select-Object FullName, Length
            throw "Installer not produced at $expected"
          }
          Get-Item $expected | Select-Object FullName, Length

      - name: Upload ISCC log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iscc-log
          path: iscc.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: pars-gate-installer
          path: installer/ParsGate-Setup-v0.6.exe
          if-no-files-found: error
          retention-days: 30

      - name: Dump CI log to ci-log branch
        if: always()
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Single collected log: every earlier step's log file plus this run's status.
          $log = "build_error.log"
          if (Test-Path $log) { Remove-Item $log -Force }
          @(
            "=== ParsGate CI log ===",
            "commit: ${{ github.sha }}",
            "run:    ${{ github.run_id }}",
            "job status: ${{ job.status }}",
            ""
          ) | Out-File -FilePath $log -Encoding utf8

          foreach ($f in @("publish.log", "iscc.log")) {
            if (Test-Path $f) {
              "" | Out-File -FilePath $log -Append -Encoding utf8
              "=== $f ===" | Out-File -FilePath $log -Append -Encoding utf8
              Get-Content $f -Raw | Out-File -FilePath $log -Append -Encoding utf8
            }
          }

          git config user.name "ci"
          git config user.email "ci@local"
          git checkout -B ci-log
          git add -f $log
          git commit -m "ci log ${{ github.run_id }}" --allow-empty
          git push -f origin ci-log
        continue-on-error: true

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: pars-gate-installer
          path: dist

      - name: Create release v0.6 with installer asset
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installerPath = "dist\ParsGate-Setup-v0.6.exe"
          if (-not (Test-Path $installerPath)) {
            Get-ChildItem -Recurse dist | Select-Object FullName, Length
            throw "Installer artifact missing after download"
          }
          Get-Item $installerPath | Select-Object FullName, Length

          $notesLines = @(
            "## ParsGate v0.6",
            "",
            "Windows VPN / circumvention client with:",
            "",
            "- Xray-core (SOCKS5) + sing-box (TUN) engines",
            "- Iran direct routing (geoip-ir, geosite-ir)",
            "- Split tunneling (process / domain / IP based)",
            "- Kill switch with anti-lockout",
            "- NVDA-accessible high-contrast RTL Persian UI",
            "- Zero-UAC launch via Scheduled Task (ParsGateElevatedTask)",
            "- Standard Windows UAC manifest (asInvoker)",
            "- Fixed win-x64 runtime targeting for reliable WPF startup",
            "- Removed OverrideMetadata causing Window static init crash",
            "- Circular central Connect button (200x200)",
            "- Dark ComboBox with readable text",
            "- Keep in Taskbar on minimize, bring existing window to front",
            "- QUIC blocking for YouTube TCP fallback",
            "- TUN mtu=1400, stack=mixed, sniff=true for better compatibility"
          )
          Set-Content -Path "notes.md" -Value $notesLines -Encoding UTF8

          # Remove any stale v0.6 release (and its tag) so the new one is brand new.
          gh release view v0.6 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete v0.6 --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) { throw "failed to delete existing v0.6 release" }
          }

          gh release create v0.6 $installerPath --title "ParsGate v0.6" --notes-file notes.md --latest
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
          Write-Host "Release v0.6 published with installer asset"

      - name: Dump release log to ci-log branch
        if: always()
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $log = "release_error.log"
          @(
            "=== ParsGate release job ===",
            "commit: ${{ github.sha }}",
            "run:    ${{ github.run_id }}",
            "status: ${{ job.status }}",
            ""
          ) | Out-File -FilePath $log -Encoding utf8
          gh release list --limit 5 *>> $log
          gh release view v0.6 --json tagName,assets *>> $log
          $env:GIT_REDIRECT_STDERR = '2>&1'
          git config user.name "ci"
          git config user.email "ci@local"
          git checkout -B ci-log
          git add -f $log
          git commit -m "release log ${{ github.run_id }}" --allow-empty
          git push -f origin ci-log
        continue-on-error: true
